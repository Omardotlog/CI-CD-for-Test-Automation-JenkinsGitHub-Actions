name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: |
            ./bugtracker-backend/go.sum

      - name: Execute Backend Unit Tests
        working-directory: ./bugtracker-backend
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go test -json -coverprofile=coverage.out -covermode=atomic ./... > test-output.json
          go tool cover -func=coverage.out > coverage.txt
          echo "## Go Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.json | "$(go env GOPATH)/bin/go-junit-report" > test-results.xml
          go tool cover -html=coverage.out -o coverage.html
          mkdir -p reports
          mv coverage.html reports/

      - name: Backend Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Tests
          path: ./bugtracker-backend/test-results.xml
          reporter: java-junit

      - name: Upload Backend Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            ./bugtracker-backend/test-results.xml
            ./bugtracker-backend/reports
          if-no-files-found: ignore

  frontend-unit-tests:
    needs: backend-unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            ./bugtracker-frontend/package-lock.json

      - name: Execute Frontend Unit Tests
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test
          echo "## Frontend Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/lcov.info ]; then
            echo '### Coverage Summary' >> $GITHUB_STEP_SUMMARY
            echo 'Coverage report generated successfully' >> $GITHUB_STEP_SUMMARY
          fi
          mkdir -p reports
          if [ -d coverage ]; then cp -R coverage reports/coverage; fi

      - name: Frontend Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Unit Tests
          path: ./bugtracker-frontend/test-results.xml
          reporter: jest-junit

      - name: Upload Frontend Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            ./bugtracker-frontend/test-results.xml
            ./bugtracker-frontend/coverage
            ./bugtracker-frontend/reports
          if-no-files-found: ignore